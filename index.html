<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스푸퍼 구매</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>스푸퍼 구매</h1>
  </header>

  <section class="products">
    <div class="product">
      <h2>ONIA SPOOFER</h2>
      <p>고급 스푸퍼 - 탐지되지 않음</p>
      <button onclick="purchase('ONIA SPOOFER')">구매하기</button>
    </div>
    <div class="product">
      <h2>TEMP SPOOFER</h2>
      <p>일회성 스푸퍼 - 감지됨</p>
      <button onclick="purchase('TEMP SPOOFER')">구매하기</button>
    </div>
    <div class="product">
      <h2>CLEANING ONLY</h2>
      <p>스푸핑 없이 클리닝만</p>
      <button onclick="purchase('CLEANING ONLY')">구매하기</button>
    </div>
  </section>

  <section class="review">
    <h3>구매 후기 작성</h3>
    <textarea id="reviewText" placeholder="후기를 입력하세요."></textarea>
    <button onclick="submitReview()">후기 제출</button>
  </section>

  <footer>
    <p>결제: 계좌 이체, 문상, 코인 (문의는 디스코드)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
