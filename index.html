<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매 사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>상품 리스트</h1>
    </header>
    <main>
        <div class="product-list">
            <div class="product">
                <img src="product1.jpg" alt="상품 1">
                <h2>상품 1</h2>
                <p class="price">가격: $100</p>
                <button class="add-to-cart" data-product-name="상품 1" data-product-id="1">구매하기</button>
            </div>
            <div class="product">
                <img src="product2.jpg" alt="상품 2">
                <h2>상품 2</h2>
                <p class="price">가격: $200</p>
                <button class="add-to-cart" data-product-name="상품 2" data-product-id="2">구매하기</button>
            </div>
        </div>

        <!-- 구매 후 후기 작성 폼 (숨겨짐) -->
        <div id="review-form" class="hidden">
            <h2>구매 후기를 남겨주세요!</h2>
            <textarea id="review-text" placeholder="후기를 작성해 주세요..." rows="4"></textarea>
            <button id="submit-review">후기 제출</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
