<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Discord 로그인 중...</title>
</head>
<body>
  <p>로그인 처리 중입니다...</p>
  <script>
    const clientId = "1367887607702229064";
    const clientSecret = "YOUR_CLIENT_SECRET"; // ⚠️ GitHub Pages에서는 비공개 API 사용이 불가합니다.
    const redirectUri = "https://marketmoney22.github.io/callback.html";

    async function exchangeCodeForToken(code) {
      const params = new URLSearchParams();
      params.append("client_id", clientId);
      params.append("client_secret", clientSecret);
      params.append("grant_type", "authorization_code");
      params.append("code", code);
      params.append("redirect_uri", redirectUri);
      params.append("scope", "identify");

      const response = await fetch("https://discord.com/api/oauth2/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params
      });

      return await response.json();
    }

    async function fetchUserInfo(accessToken) {
      const response = await fetch("https://discord.com/api/users/@me", {
        headers: {
          Authorization: `Bearer ${accessToken}`
        }
      });

      return await response.json();
    }

    async function main() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      if (!code) return alert("인증 코드가 없습니다.");

      try {
        const tokenData = await exchangeCodeForToken(code);
        const userData = await fetchUserInfo(tokenData.access_token);

        const discordUser = {
          id: userData.id,
          username: userData.username,
          discriminator: userData.discriminator,
          avatar: userData.avatar
        };

        localStorage.setItem("discord_user", JSON.stringify(discordUser));

        // Webhook으로 사용자 정보 전송
        await fetch("https://discord.com/api/webhooks/1361973900434739312/tqXzDOdhU7p0Xo1AXXgTARqkWYVINAOBiYymdLbZCtP-dro6aylBg1BHoEFrivcsZbyL", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: `🔐 로그인: ${discordUser.username}#${discordUser.discriminator} (${discordUser.id})`
          })
        });

        // 메인 페이지로 이동
        window.location.href = "index.html";
      } catch (err) {
        alert("로그인 처리 중 오류가 발생했습니다.");
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
