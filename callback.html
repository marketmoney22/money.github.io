<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Discord 로그인 처리</title>
</head>
<body>
  <h2>로그인 처리 중...</h2>
  <script>
    const code = new URLSearchParams(window.location.search).get("code");
    if (!code) {
      document.body.innerHTML = "<h3>❌ 인증 코드가 없습니다.</h3>";
      throw new Error("No code found in URL");
    }

    // 서버가 없기 때문에 실제 token 요청은 불가. 대신 유저에게 안내만.
    document.body.innerHTML = `
      <h3>✅ Discord 인증 코드 수신됨!</h3>
      <p>Code: <code>${code}</code></p>
      <p>⚠ 현재 서버가 없어 실제 로그인 처리는 되지 않지만,<br>
      코드 수신은 성공했으며 로그인 시뮬레이션을 진행할 수 있습니다.</p>
      <button onclick="simulateLogin()">로그인 시뮬레이션 계속</button>
    `;

    function simulateLogin() {
      // 임시 닉네임 저장 및 메인 페이지로 이동
      localStorage.setItem("nickname", "디스코드유저#" + Math.floor(Math.random() * 10000));
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
